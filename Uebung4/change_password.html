<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/styles.css" />

  <title>Passwort ändern</title>
</head>

<body>

  <script src="scripts/insert_navbar.js" type="module"></script>

  <section class="grid center-items">
    <div class="spacer-1em"></div>
    <h1>Passwort ändern</h1>
    <!--onsubmit: return false verhindert ein neu laden der seite nach klick auf den submit button
      da die eingaben erhalten bleiben sollen, sollte irgendetwas nicht klappen
    -->
    <form class="registration_login_form" method="post" id="register_form" name="registerForm" onsubmit="return false">
      <label for="oldPassword">Aktuelles Passwort</label>
      <br />
      <input type="password" id="oldPassword" name="oldPassword" placeholder=" " required />
      <br/>
      <label for="password">Neues Passwort </label>
      <br />
      <input type="password" id="password" name="password" placeholder=" " required />
      <div id="password_info">
        <p>
          Passwort muss enthalten: <br />
          <span id="longEnough">Mind. 7 Zeichen</span> <br />
          <span id="containsNumbers">Mind. 5 Ziffern</span> <br />
          <span id="containsUpperCase">Mind. 1 Großbuchstaben</span> <br />
          <span id="containsLowerCase">Mind. 1 Kleinbuchstaben</span>
        </p>
      </div>
      <br />
      <label for="password_repeat">Passwort wiederholen </label>
      <br />
      <input type="password" id="password_repeat" name="password_repeat" placeholder=" " required />
      <p id="passwords_not_matching">Passwörter stimmen nicht überein</p>
      <button type="submit" id="submit_button">Ändern</button>
      <button type="button" class="outline_button_red" onclick="history.back()">Abbrechen</button>
    </form>
    <div class="spacer-5em"></div>
  </section>

  <script src="scripts/registercheck.js" type="module"></script>
  <script src="scripts/change_password.js" type="module"></script>
  <noscript>
    JavaScript is inactive!
  </noscript>
</body>

</html>
