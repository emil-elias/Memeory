<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/styles.css" />

  <title>Spielübersicht</title>
</head>

<body>
  <script src="scripts/insert_navbar.js" type="module"></script>



  <section class="grid center-items">
    <div class="spacer-1em"></div>
    <h1>Spielübersicht</h1>
    <p>
      Klicke auf eine Spaltenüberschrift um die Tabelle entsprechend zu
      sortieren
    </p>
    <div class="spacer-1em"></div>
    <table class="library_table sortable" id="games_table">
      <tr>
        <th class="clickable sort_number" data-col="0">Spieldatum</th>
        <th class="clickable sort_number" data-col="1">Level</th>
        <th class="clickable sort_number" data-col="2">Spieldauer</th>
        <th class="clickable sort_number" data-col="3">Spielart</th>
        <th>Initiator</th>
        <th>Mitspieler</th>
        <th>Gewinner</th>
        <th>Verlauf</th>
      </tr>
    </table>
    <div class="spacer-5em"></div>
  </section>
  <button id="backToTop" title="Zurück zum Seitenanfang" class="subtle">Nach oben</button>
  <script src="scripts/back_to_top.js" type="module" defer></script>

  <script src="./scripts/game_overview.js" type="module"></script>
</body>

</html>
