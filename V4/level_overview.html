<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/styles.css" />

  <title>Levelübersicht</title>
</head>

<body>
  <script src="scripts/insert_navbar.js" type="module"></script>

  <section class="grid center-items">
    <div class="spacer-1em"></div>
    <h1>Levelübersicht</h1>
    <table class="library_table" id="level_table">
      <a id="addLevelButton" style="display: none;">
        <button>+ Level hinzufügen</button>
      </a>
      <div class="spacer-2em"></div>
      <tr>
        <th>Nummer</th>
        <th>Spielzeit</th>
        <th>Kartenanzahl</th>
        <th>XP</th>
        <th></th>
    </table>
    <div class="spacer-5em"></div>
  </section>
  <button id="backToTop" title="Zurück zum Seitenanfang" class="subtle">Nach oben</button>
  <script src="scripts/back_to_top.js" type="module" defer></script>
  <script src="./scripts/level_overview.js" type="module"></script>
</body>

</html>
