<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />

    <title>Karte hinzufügen</title>
  </head>
  <body>
    <section class="grid center-items">
      <div class="spacer-5em"></div>
      <h1>Neue Karte hinzufügen</h1>
      <form
        action=""
        class="upload_form"
        method="post"
        enctype="multipart/form-data"
      >
        <label for="newcard-picture">Bild</label>
        <br/>
        <input type="file" id="newcard-picture" name="newcard-picture" />
        <br/>
        <label for="newcard-name">Name</label>
        <br/>
        <input type="text" id="newcard-name" name="newcard-name"/>
        <button type="submit">Hochladen</button>
      </form>
    </section>
  </body>
</html>
