<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />

    <title>Registrieren</title>
  </head>
  <body>
    <section class="grid center-items">
      <div class="spacer-5em"></div>
      <h1>Registrieren</h1>
      <form action="" class="registration_login_form" method="post">
        <label for="first_name">Vorname </label>
        <br />
        <input type="text" id="first_name" name="first_name" />
        <br />
        <label for="last_name">Nachname </label>
        <br />
        <input type="text" id="last_name" name="last_name" />
        <br />
        <label for="email_address">E-Mail </label>
        <br />
        <input type="email" id="email_address" name="e-mail" />
        <br />
        <label for="password">Passwort </label>
        <br />
        <input type="password" id="password" name="password" />
        <br />
        <label for="password_repeat">Passwort wiederholen </label>
        <br />
        <input type="password" id="password_repeat" name="password_repeat" />
        <button type="submit">Registrieren</button>
      </form>
      <p>Bereits ein Konto?</p>
      <a href="login.html">Anmelden</a>
    </section>
  </body>
</html>
